<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Rainwater Harvesting Analyzer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <!-- Brand -->

        <div class="brand">

            <div class="brand-icon">
                💧
            </div>

            <div>
                <h1>Rainwater Analyzer</h1>
                <p>Harvesting Potential Analysis</p>
            </div>

        </div>


        <!-- Heading -->

        <div class="auth-heading">

            <h2>Create your account</h2>

            <p>
                Create an account to analyze your
                rainwater harvesting potential.
            </p>

        </div>


        <!-- Error -->

        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <!-- Registration Form -->

        <form method="POST">


            <div class="form-group">

                <label for="name">
                    Full name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone number
                    <span class="optional">(Optional)</span>
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>


        </form>


        <!-- Login Link -->

        <div class="divider">
            <span>Already registered?</span>
        </div>


        <p class="bottom-text">

            Sign in to continue your analysis.

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


    </div>

</div>

</body>

</html>
